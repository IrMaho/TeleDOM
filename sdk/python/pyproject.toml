[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teledom"
version = "4.1.0"
description = "TeleDOM Python SDK — semantic browser programming over the TeleDOM Agent-Owned Workflow Runtime (Level 2: Bot → SDK → Browser Runtime)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TeleDOM" }]
keywords = ["browser-automation", "mcp", "rpa", "agent", "workflow", "semantic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []  # pure stdlib — zero dependencies

[project.urls]
Homepage = "https://github.com/IrMaho/TeleDOM"

[tool.setuptools.packages.find]
include = ["teledom*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF022"]
ignore = [
    "EXE001",
    "UP045",
    "BLE001",
    "S110",
    "PYI034",
    "UP037",
    "E402",
    "E501",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
